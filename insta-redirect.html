<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인스타그램으로 이동 중...</title>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: -apple-system, sans-serif;
      background: #fff;
      flex-direction: column;
      gap: 12px;
    }
    p { color: #555; font-size: 15px; margin: 0; }
    a { color: #C13584; font-weight: 600; font-size: 15px; }
  </style>
</head>
<body>
  <p>인스타그램으로 이동 중...</p>
  <a id="fallback-link" href="https://www.instagram.com/pokemongoappko/" style="display:none">
    앱이 안 열리면 여기를 눌러주세요
  </a>

  <script>
    const USERNAME = "pokemongoappko";

    const webURL = `https://www.instagram.com/${USERNAME}/`;

    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    const isAndroid = /Android/i.test(navigator.userAgent);

    const appURL = isAndroid
      ? `intent://user?username=${USERNAME}#Intent;scheme=instagram;package=com.instagram.android;end`
      : `instagram://user?username=${USERNAME}`;

    const fallbackLink = document.getElementById("fallback-link");
    fallbackLink.href = webURL;

    if (isIOS || isAndroid) {
      window.location.href = appURL;
      setTimeout(() => {
        fallbackLink.style.display = "block";
        window.location.href = webURL;
      }, 1500);
    } else {
      window.location.href = webURL;
    }
  </script>
</body>
</html>
